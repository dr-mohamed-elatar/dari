name: dari_app
description: "نظام التقسيط الذكي — إدارة عملاء وعقود تقسيط وأقساط وتحصيل"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sqflite: ^2.4.0
  sqflite_common_ffi: ^2.3.4
  sqflite_common_ffi_web: ^1.0.0
  path: ^1.9.0
  path_provider: ^2.1.4
  provider: ^6.1.2
  uuid: ^4.5.1
  crypto: ^3.0.5
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.2.2
  device_info_plus: ^11.1.0
  excel: ^4.0.6
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^10.1.3
  file_picker: ^10.0.0
  url_launcher: ^6.3.1
  google_mobile_ads: ^9.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
